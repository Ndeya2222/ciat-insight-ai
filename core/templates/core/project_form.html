{% extends "core/base.html" %}{% block content %}<h1 class="h3 mb-3">{{ title }}</h1>
<form method="post" class="card card-body" novalidate>{% csrf_token %}{{ form.non_field_errors }}
<div class="row g-3">{% for f in form %}<div class="col-md-{% if f.name in 'description problem solution objectives' %}12{% else %}6{% endif %}"><label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}</div>
<div class="mt-3"><button class="btn btn-primary">Enregistrer</button> <a class="btn btn-outline-secondary" href="{% url 'project_list' %}">Annuler</a></div></form>{% endblock %}
