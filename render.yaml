services:
  - type: web
    name: ciat-insight-ai
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn ciat.wsgi
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true   # mot de passe des comptes démo, visible dans le tableau de bord Render
      - key: DATABASE_URL
        fromDatabase:
          name: ciat-db
          property: connectionString
      - key: AI_API_KEY
        sync: false           # laisser vide = mode démonstration
databases:
  - name: ciat-db
    plan: free
